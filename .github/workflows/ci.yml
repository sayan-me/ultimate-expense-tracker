name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: PWA (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

      # Intentionally no Firebase env vars: the app must build without them.
      - run: pnpm build

  user-service:
    name: User service (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/user-service/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/services/user-service/functions/package-lock.json

      - run: npm ci
      - run: npm run build
